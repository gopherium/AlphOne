schema:
  - graph/schema/*.graphqls
  - plugins/*/graph/*.graphqls
  - enterprise/*/graph/*.graphqls
exec:
  filename: graph/generated.go
  package: graph
directives:
  scope:
    skip_runtime: true
model:
  filename: graph/model/models_gen.go
  package: model
models:
  Upload:
    model: github.com/99designs/gqlgen/graphql.Upload
  UUID:
    model: github.com/gopherium/alphone/graph/scalar.UUID
  DateTime:
    model: github.com/gopherium/alphone/graph/scalar.DateTime
  Date:
    model: github.com/gopherium/alphone/graph/scalar.Date
  JSON:
    model: github.com/99designs/gqlgen/graphql.Any
