root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/alphone ./cmd/alphone"
  bin = "./.air/alphone"
  include_ext = ["go"]
  exclude_dir = [".air", ".covdata", "node_modules", "frontend", "docs", "test", "deploy", "patches", "scripts"]
  exclude_regex = ["_test\\.go$", "generated\\.go$", "models_gen\\.go$"]
  exclude_unchanged = true
  stop_on_error = false
