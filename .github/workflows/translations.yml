name: translations

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.moved.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make translations
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
          POEDITOR_PROJECT_ALPHONE: ${{ secrets.POEDITOR_PROJECT_ALPHONE }}
          POEDITOR_PROJECT_ALPHONE_FIELDS: ${{ secrets.POEDITOR_PROJECT_ALPHONE_FIELDS }}
          POEDITOR_PROJECT_ALPHONE_IMPORTER: ${{ secrets.POEDITOR_PROJECT_ALPHONE_IMPORTER }}
          POEDITOR_PROJECT_ALPHONE_WHATSAPP: ${{ secrets.POEDITOR_PROJECT_ALPHONE_WHATSAPP }}
      - run: make catalogs
      - name: Keep the translation changes as a patch
        id: moved
        run: |
          if [ -n "$(git status --porcelain languages plugins/*/languages frontend/src/languages plugins/*/frontend/languages)" ]; then
            git add -- languages plugins/*/languages frontend/src/languages plugins/*/frontend/languages
            git diff --cached --binary > "$RUNNER_TEMP/translations.patch"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.moved.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translations
          path: ${{ runner.temp }}/translations.patch
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: sync
    if: needs.sync.outputs.moved == 'true'
    runs-on: ubuntu-latest
    environment: translations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: translations
          path: ${{ runner.temp }}/translations
      - run: git apply --index "$RUNNER_TEMP/translations/translations.patch"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRANSLATIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRANSLATIONS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: translations/batch
          title: "chore(i18n): carry the translations that arrived"
          body: |
            The translation platform exported new work since the last batch.

            Every catalogue here was compiled from its source, so the byte
            comparison gate proves the shipped files match.
          commit-message: "chore(i18n): carry the translations that arrived"
          sign-commits: true
          delete-branch: true
