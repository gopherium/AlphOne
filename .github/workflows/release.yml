name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the embedded version matches the tag
        run: |
          embedded="$(cat internal/version/VERSION)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$embedded" != "$tagged" ]; then
            echo "internal/version/VERSION is $embedded but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Check whether this tag is the newest stable version
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
            | sed 's|^refs/tags/||' | grep -v -- - | sort -V | tail -n 1)"
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is not the newest stable tag, $newest is, so latest stays where it is"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gopherium/alphone
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
