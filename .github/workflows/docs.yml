name: docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the embedded version matches the tag
        if: github.ref_type == 'tag'
        run: |
          embedded="$(cat internal/version/VERSION)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$embedded" != "$tagged" ]; then
            echo "internal/version/VERSION is $embedded but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
