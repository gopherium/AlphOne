engineStrict: true

packages:
  - frontend
  - sdk/frontend
  - sdk/ui-primitives
  - plugins/*/frontend
  - enterprise/*/frontend
  - test/e2e
  - test/runbook

minimumReleaseAgeExclude:
  - '@gopherium/godmin'
  - '@gopherium/react-auth@0.3.0'

overrides:
  react: ^19.2.8
  react-dom: ^19.2.8

peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    '@types/react': '19'
    typescript: '6'
    graphql: '17'

allowBuilds:
  esbuild: false
  msw: false
