packages:
  - frontend
  - sdk/frontend
  - sdk/ui-primitives
  - plugins/*/frontend
  - test/e2e

minimumReleaseAgeExclude:
  - '@gopherium/godmin'

overrides:
  react: ^19.2.8
  react-dom: ^19.2.8

peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    '@types/react': '19'
    typescript: '6'

allowBuilds:
  esbuild: false
  msw: false

patchedDependencies:
  '@wordpress/element@8.4.0': patches/@wordpress__element@8.4.0.patch
