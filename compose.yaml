# Development stack only.
services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "max_connections=300"]
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    environment:
      POSTGRES_PASSWORD: alphone
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.6
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    profiles: ["s3"]
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./test/s3/garage.toml:/etc/garage.toml:ro

volumes:
  postgres-data:
  n8n-data:
