version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - gocognit
    - lll
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
    depguard:
      rules:
        sdk-purity:
          list-mode: strict
          files:
            - "**/sdk/*.go"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/gopherium/pluginkit
        plugins-import-only-the-sdk:
          list-mode: lax
          files:
            - "**/plugins/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/gopherium/alphone/internal
              desc: plugins may import only the sdk package from AlphOne
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gopherium/alphone
