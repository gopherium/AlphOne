version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - gocognit
    - lll
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
    depguard:
      rules:
        sdk-purity:
          list-mode: strict
          files:
            - "**/sdk/*.go"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/gopherium/framework/goncierge
            - github.com/gopherium/framework/gonsole
            - github.com/gopherium/framework/pluginkit
        plugins-never-import-internal:
          list-mode: lax
          files:
            - "**/plugins/**/*.go"
            - "**/enterprise/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/gopherium/alphone/internal
              desc: plugins may import only the sdk and graph packages from AlphOne
        plugins-keep-files-through-the-sdk:
          list-mode: lax
          files:
            - "**/plugins/**/*.go"
            - "**/enterprise/**/*.go"
            - "!$test"
          deny:
            - pkg: gocloud.dev
              desc: plugins keep files through the file store the sdk hands them
            - pkg: github.com/gopherium/framework/postgresblob
              desc: plugins keep files through the file store the sdk hands them
            - pkg: github.com/aws/aws-sdk-go-v2/service/s3
              desc: plugins keep files through the file store the sdk hands them
            - pkg: github.com/aws/aws-sdk-go-v2/feature/s3
              desc: plugins keep files through the file store the sdk hands them
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gopherium/alphone
