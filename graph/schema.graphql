directive @goField(forceResolver: Boolean, name: String, omittable: Boolean) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
type Contact {
	id: UUID!
	name: String!
	createdAt: DateTime! @goField(forceResolver: true)
	identities: [ContactIdentity!]! @goField(forceResolver: true)
	tasks(status: String, first: Int, after: String): TaskConnection! @goField(forceResolver: true)
	whatsAppConversations: [WhatsAppConversation!]! @goField(forceResolver: true)
}
type ContactConnection {
	edges: [ContactEdge!]!
	pageInfo: PageInfo!
}
type ContactEdge {
	node: Contact!
	cursor: String!
}
type ContactIdentity {
	id: UUID!
	channel: String!
	identifier: String!
	displayName: String!
}
input ContactIdentityInput {
	channel: String!
	identifier: String!
	displayName: String
}
input CreateTaskInput {
	title: String!
	dueOn: Date!
	priority: Int
	contactId: UUID
	originEventId: UUID
}
type CreateTaskPayload {
	task: Task!
	replay: Boolean!
}
type CreateWebhookPayload {
	webhook: Webhook!
	secret: String!
}
scalar Date
scalar DateTime
type Identity {
	id: UUID!
	email: String!
	name: String!
}
type ImportAssignment {
	column: Int!
	field: String!
}
input ImportAssignmentInput {
	column: Int!
	field: String!
}
type ImportCommitPayload {
	id: UUID!
	imported: Int!
	skipped: Int!
	failed: Int!
}
type ImportContact {
	contactId: UUID!
	name: String!
	rowId: UUID!
}
type ImportField {
	name: String!
	label: String!
	required: Boolean!
}
type ImportJob {
	id: UUID!
	userId: UUID!
	filename: String!
	state: String!
	rowCount: Int!
	importedCount: Int!
	skippedCount: Int!
	failedCount: Int!
	createdAt: DateTime!
	columns: [String!]!
	mapping: [ImportAssignment!]!
	rows(limit: Int): [ImportRow!]! @goField(forceResolver: true)
	contacts: [ImportContact!]! @goField(forceResolver: true)
}
type ImportRow {
	id: UUID!
	position: Int!
	cells: [String!]!
	outcome: String!
	reason: String
	contactId: UUID
}
type LoginPayload {
	me: Identity!
}
type Mutation {
	createContact(name: String!, identities: [ContactIdentityInput!]): Contact!
	renameContact(id: UUID!, name: String!): Contact!
	addContactIdentity(contactId: UUID!, identity: ContactIdentityInput!): ContactIdentity!
	deleteContactIdentity(contactId: UUID!, identityId: UUID!): Boolean!
	login(email: String!, password: String!): LoginPayload!
	logout: Boolean!
	createUser(email: String!, name: String!, password: String!): User!
	setUserDisabled(id: UUID!, disabled: Boolean!): Boolean!
	createTask(input: CreateTaskInput!): CreateTaskPayload!
	updateTask(id: UUID!, input: UpdateTaskInput!): Task!
	createWebhook(url: String!, events: [String!]!): CreateWebhookPayload!
	deleteWebhook(id: UUID!): Boolean!
	importUpload(file: Upload!): ImportJob!
	importSetMapping(id: UUID!, assignments: [ImportAssignmentInput!]!): ImportJob!
	importCommit(id: UUID!): ImportCommitPayload!
	whatsAppSendMessage(conversationId: UUID!, content: String!): WhatsAppMessage!
}
type PageInfo {
	hasNextPage: Boolean!
	hasPreviousPage: Boolean!
	startCursor: String
	endCursor: String
}
type Query {
	version: String!
	me: Identity!
	users: [User!]!
	contacts(q: String, first: Int, after: String): ContactConnection!
	contact(id: UUID!): Contact
	tasks(date: Date, dueBefore: Date, contactId: UUID, status: String, first: Int, after: String): TaskConnection!
	task(id: UUID!): Task
	webhooks: [Webhook!]!
	imports: [ImportJob!]!
	importJob(id: UUID!): ImportJob
	importFields: [ImportField!]!
	whatsAppConversations(limit: Int): [WhatsAppConversation!]!
}
type Subscription {
	coreEvent: String!
	whatsAppConversationEvent: UUID!
	whatsAppMessageReceived(conversationId: UUID!): WhatsAppMessage!
}
type Task {
	id: UUID!
	assigneeId: UUID!
	contactId: UUID
	title: String!
	status: String!
	priority: Int!
	dueOn: Date!
	originSource: String
	originEventId: UUID
	createdAt: DateTime!
