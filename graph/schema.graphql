	messages(limit: Int): [WhatsAppMessage!]! @goField(forceResolver: true)
}
type WhatsAppMedia {
	status: String!
	mimeType: String!
	filename: String
	fileSize: Int
	voice: Boolean!
	animated: Boolean!
	downloadPath: String!
}
type WhatsAppMessage {
	id: UUID!
	externalId: String!
	direction: String!
	content: String!
	contentType: String!
	sentAt: DateTime!
	status: String
	statusDetail: String
	media: WhatsAppMedia
}
