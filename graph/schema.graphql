}
type TaskConnection {
	edges: [TaskEdge!]!
	pageInfo: PageInfo!
}
type TaskEdge {
	node: Task!
	cursor: String!
}
scalar UUID
input UpdateTaskInput {
	title: String
	dueOn: Date
	status: String
	priority: Int
}
scalar Upload
type User {
	id: UUID!
	email: String!
	name: String!
