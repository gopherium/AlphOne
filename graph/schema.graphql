directive @goField(forceResolver: Boolean, name: String, omittable: Boolean) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @scope(area: String!, write: Boolean!, admin: Boolean = false) on FIELD_DEFINITION
type ApiToken {
	id: UUID!
	name: String!
	scopes: [String!]!
	createdAt: DateTime!
	lastUsedAt: DateTime
	expiresAt: DateTime
}
type ApiTokenSecret {
	token: ApiToken!
	secret: String!
}
type Contact {
	id: UUID!
	name: String!
	createdAt: DateTime! @goField(forceResolver: true)
	identities: [ContactIdentity!]! @goField(forceResolver: true)
	tasks(status: String, first: Int, after: String): TaskConnection! @goField(forceResolver: true)
	field(name: String!): JSON @goField(forceResolver: true)
	whatsAppConversations: [WhatsAppConversation!]! @goField(forceResolver: true)
}
type ContactConnection {
	edges: [ContactEdge!]!
	pageInfo: PageInfo!
}
type ContactEdge {
	node: Contact!
	cursor: String!
}
type ContactIdentity {
	id: UUID!
	channel: String!
	identifier: String!
	displayName: String!
}
input ContactIdentityInput {
	channel: String!
	identifier: String!
	displayName: String
}
input CreateTaskInput {
	title: String!
	dueOn: Date!
	priority: Int
	contactId: UUID
	originEventId: UUID
}
type CreateTaskPayload {
	task: Task!
	replay: Boolean!
}
type CreateWebhookPayload {
	webhook: Webhook!
	secret: String!
}
scalar Date
scalar DateTime
type FieldDefinition {
	id: UUID!
	name: String!
	label: String!
	kind: FieldKind!
	archivedAt: DateTime
}
enum FieldKind {
	TEXT
	LONGTEXT
	NUMBER
	BOOLEAN
	DATE
	SELECT
}
type Identity {
	id: UUID!
	email: String!
	name: String!
	role: String!
}
type ImportAssignment {
	column: Int!
	field: String!
}
input ImportAssignmentInput {
	column: Int!
	field: String!
}
type ImportCommitPayload {
	id: UUID!
	imported: Int!
	skipped: Int!
	failed: Int!
}
type ImportContact {
	contactId: UUID!
	name: String!
	rowId: UUID!
}
type ImportField {
	name: String!
	label: String!
	required: Boolean!
}
type ImportJob {
	id: UUID!
	userId: UUID!
	filename: String!
	state: String!
	rowCount: Int!
	importedCount: Int!
	skippedCount: Int!
	failedCount: Int!
	createdAt: DateTime!
	columns: [String!]!
	mapping: [ImportAssignment!]!
	rows(limit: Int): [ImportRow!]! @goField(forceResolver: true)
	contacts: [ImportContact!]! @goField(forceResolver: true)
}
type ImportRow {
	id: UUID!
	position: Int!
	cells: [String!]!
	outcome: String!
	reason: String
	contactId: UUID
}
scalar JSON
type LoginPayload {
	me: Identity!
}
type Mutation {
	createContact(name: String!, identities: [ContactIdentityInput!]): Contact! @scope(area: "contacts", write: true)
	renameContact(id: UUID!, name: String!): Contact! @scope(area: "contacts", write: true)
	addContactIdentity(contactId: UUID!, identity: ContactIdentityInput!): ContactIdentity! @scope(area: "contacts", write: true)
	deleteContactIdentity(contactId: UUID!, identityId: UUID!): Boolean! @scope(area: "contacts", write: true)
	login(email: String!, password: String!): LoginPayload! @scope(area: "auth", write: true)
	logout: Boolean! @scope(area: "auth", write: true)
	createUser(email: String!, name: String!, password: String!): User! @scope(area: "users", write: true, admin: true)
	setUserDisabled(id: UUID!, disabled: Boolean!): Boolean! @scope(area: "users", write: true, admin: true)
	createTask(input: CreateTaskInput!): CreateTaskPayload! @scope(area: "tasks", write: true)
	updateTask(id: UUID!, input: UpdateTaskInput!): Task! @scope(area: "tasks", write: true)
	apiTokenCreate(name: String!, scopes: [String!]!, ttlDays: Int): ApiTokenSecret! @scope(area: "tokens", write: true)
	apiTokenRevoke(id: UUID!): Boolean! @scope(area: "tokens", write: true)
	createWebhook(url: String!, events: [String!]!): CreateWebhookPayload! @scope(area: "webhooks", write: true)
	deleteWebhook(id: UUID!): Boolean! @scope(area: "webhooks", write: true)
	defineField(name: String!, label: String!, kind: FieldKind!): FieldDefinition! @scope(area: "fields", write: true)
	archiveField(id: UUID!): Boolean! @scope(area: "fields", write: true)
	writeContactFields(contactId: UUID!, values: JSON!): Boolean! @scope(area: "contacts", write: true)
	importUpload(file: Upload!): ImportJob! @scope(area: "imports", write: true)
	importSetMapping(id: UUID!, assignments: [ImportAssignmentInput!]!): ImportJob! @scope(area: "imports", write: true)
	importCommit(id: UUID!): ImportCommitPayload! @scope(area: "imports", write: true)
	whatsAppSendMessage(conversationId: UUID!, content: String!): WhatsAppMessage! @scope(area: "whatsapp", write: true)
}
type PageInfo {
	hasNextPage: Boolean!
	hasPreviousPage: Boolean!
	startCursor: String
	endCursor: String
}
type Query {
	version: String! @scope(area: "meta", write: false)
	tenant: Tenant! @scope(area: "meta", write: false)
	me: Identity! @scope(area: "auth", write: false)
	users: [User!]! @scope(area: "users", write: false)
	contacts(q: String, first: Int, after: String): ContactConnection! @scope(area: "contacts", write: false)
	contact(id: UUID!): Contact @scope(area: "contacts", write: false)
	tasks(date: Date, dueBefore: Date, contactId: UUID, status: String, first: Int, after: String): TaskConnection! @scope(area: "tasks", write: false)
	task(id: UUID!): Task @scope(area: "tasks", write: false)
	apiTokens: [ApiToken!]! @scope(area: "tokens", write: false)
	webhooks: [Webhook!]! @scope(area: "webhooks", write: false)
	fields(includeArchived: Boolean): [FieldDefinition!]! @scope(area: "fields", write: false)
	imports: [ImportJob!]! @scope(area: "imports", write: false)
	importJob(id: UUID!): ImportJob @scope(area: "imports", write: false)
	importFields: [ImportField!]! @scope(area: "imports", write: false)
	whatsAppConversations(limit: Int): [WhatsAppConversation!]! @scope(area: "whatsapp", write: false)
	whatsAppConversation(id: UUID!): WhatsAppConversation @scope(area: "whatsapp", write: false)
}
type Subscription {
	coreEvent: String! @scope(area: "events", write: false)
	whatsAppConversationEvent: UUID! @scope(area: "whatsapp", write: false)
	whatsAppMessageReceived(conversationId: UUID!): WhatsAppMessage! @scope(area: "whatsapp", write: false)
}
type Task {
	id: UUID!
	assigneeId: UUID!
	contactId: UUID
	title: String!
	status: String!
	priority: Int!
	dueOn: Date!
	originSource: String
	originEventId: UUID
	createdAt: DateTime!
	contact: Contact @goField(forceResolver: true)
}
type TaskConnection {
	edges: [TaskEdge!]!
	pageInfo: PageInfo!
}
type TaskEdge {
	node: Task!
	cursor: String!
}
type Tenant {
	id: UUID!
	name: String!
}
scalar UUID
input UpdateTaskInput {
	title: String
	dueOn: Date
	status: String
	priority: Int
}
scalar Upload
type User {
	id: UUID!
	email: String!
	name: String!
	disabled: Boolean!
	createdAt: DateTime!
	role: String!
}
type Webhook {
	id: UUID!
	url: String!
	events: [String!]!
	createdAt: DateTime!
}
type WhatsAppConversation {
	id: UUID!
	externalId: String!
	status: String!
	lastActivityAt: DateTime!
	lastMessagePreview: String
